# Solid Queue recurring jobs configuration
# Jobs defined here will be automatically enqueued according to their schedule

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  deadline_reminders:
    class: DeadlineReminderJob
    schedule: every day at 8am
    queue: default

  hearing_reminders:
    class: HearingReminderJob
    schedule: every day at 8am
    queue: default

development:
  deadline_reminders:
    class: DeadlineReminderJob
    schedule: every day at 8am
    queue: default

  hearing_reminders:
    class: HearingReminderJob
    schedule: every day at 8am
    queue: default